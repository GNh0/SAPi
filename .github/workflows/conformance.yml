name: Protocol conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '11'
      - name: Prepare isolated dependencies
        run: python tools/bootstrap.py --work-dir "${{ runner.temp }}/sapi-validation"
      - name: Verify every registered implementation pair
        run: python tools/verify.py --work-dir "${{ runner.temp }}/sapi-validation"
      - name: Verify durable state, key lifecycle and mTLS adapters
        run: python tools/verify_state.py --work-dir "${{ runner.temp }}/sapi-validation"
      - name: Check exact dependency versions against OSV
        run: python tools/audit_dependencies.py --work-dir "${{ runner.temp }}/sapi-validation"
      - name: Verify closed schemas, owned SQL and shared admission
        run: python tools/verify_security.py --work-dir "${{ runner.temp }}/sapi-validation"
      - name: Verify declarative application service and fixed HTTPS destinations
        run: python tools/verify_application.py --work-dir "${{ runner.temp }}/sapi-validation"
      - name: Build local packages
        run: python tools/package.py --work-dir "${{ runner.temp }}/sapi-validation" --output-dir "${{ runner.temp }}/sapi-packages"
      - name: Consume packaged SDKs in isolated projects
        run: python tools/smoke_packages.py --work-dir "${{ runner.temp }}/sapi-validation" --package-dir "${{ runner.temp }}/sapi-packages"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/sapi-validation/verification.json
            ${{ runner.temp }}/sapi-validation/state-verification.json
            ${{ runner.temp }}/sapi-validation/security-verification.json
            ${{ runner.temp }}/sapi-validation/application-verification.json
            ${{ runner.temp }}/sapi-validation/dependency-audit.json
            ${{ runner.temp }}/sapi-validation/packages.json
            ${{ runner.temp }}/sapi-validation/package-smoke.json
            ${{ runner.temp }}/sapi-validation/*-build.log
            ${{ runner.temp }}/sapi-validation/package.log
            ${{ runner.temp }}/sapi-packages/*
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722 # 18.6
        env:
          POSTGRES_USER: sapi_test
          POSTGRES_PASSWORD: disposable_ci_database
          POSTGRES_DB: sapi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sapi_test -d sapi_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '11'
      - name: Prepare isolated dependencies
        run: python tools/bootstrap.py --work-dir "${{ runner.temp }}/sapi-validation"
      - name: Verify shared PostgreSQL state
        run: >-
          python tools/verify_state.py --work-dir "${{ runner.temp }}/sapi-validation"
          --postgres "postgresql://sapi_test:disposable_ci_database@127.0.0.1:5432/sapi_test?sslmode=disable"
      - name: Verify application PostgreSQL ownership and bound records
        run: >-
          python tools/verify_application.py --work-dir "${{ runner.temp }}/sapi-validation"
          --postgres "postgresql://sapi_test:disposable_ci_database@127.0.0.1:5432/sapi_test?sslmode=disable"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-postgres
          path: |
            ${{ runner.temp }}/sapi-validation/state-verification.json
            ${{ runner.temp }}/sapi-validation/application-verification.json

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: harness
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '16.0.0'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
      - name: Prepare modern service and build dependencies
        run: '"${{ steps.harness.outputs.python-path }}" tools/bootstrap.py --work-dir "${{ runner.temp }}/sapi-legacy"'
        shell: bash
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: sdk_python
        with:
          python-version: '3.9'
      - name: Install SDK dependencies on Python 3.9
        run: python -m pip install --disable-pip-version-check --target "${{ runner.temp }}/sapi-sdk-deps" cryptography==50.0.1
      - name: Verify actual older SDK runtimes against modern services
        env:
          SAPI_PYTHON: ${{ steps.sdk_python.outputs.python-path }}
          SAPI_SDK_DEPS: ${{ runner.temp }}/sapi-sdk-deps
        run: '"${{ steps.harness.outputs.python-path }}" tools/verify_compatibility.py --work-dir "${{ runner.temp }}/sapi-legacy"'
        shell: bash
      - name: Build compatibility packages
        run: '"${{ steps.harness.outputs.python-path }}" tools/package.py --work-dir "${{ runner.temp }}/sapi-legacy" --output-dir "${{ runner.temp }}/sapi-legacy-packages"'
        shell: bash
      - name: Consume packages in actual older runtimes
        env:
          SAPI_PYTHON: ${{ steps.sdk_python.outputs.python-path }}
          SAPI_SDK_DEPS: ${{ runner.temp }}/sapi-sdk-deps
          SAPI_JAVAC: javac
        run: '"${{ steps.harness.outputs.python-path }}" tools/smoke_packages.py --work-dir "${{ runner.temp }}/sapi-legacy" --package-dir "${{ runner.temp }}/sapi-legacy-packages"'
        shell: bash
      - name: Audit exact compatibility dependencies
        env:
          SAPI_SDK_DEPS: ${{ runner.temp }}/sapi-sdk-deps
        run: '"${{ steps.harness.outputs.python-path }}" tools/audit_dependencies.py --work-dir "${{ runner.temp }}/sapi-legacy"'
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/sapi-legacy/*verification.json
            ${{ runner.temp }}/sapi-legacy/compatibility.json
            ${{ runner.temp }}/sapi-legacy/compatibility.log
            ${{ runner.temp }}/sapi-legacy/dependency-audit.json
            ${{ runner.temp }}/sapi-legacy/packages.json
            ${{ runner.temp }}/sapi-legacy/package-smoke.json
            ${{ runner.temp }}/sapi-legacy/package-smoke.log
            ${{ runner.temp }}/sapi-legacy-packages/*
